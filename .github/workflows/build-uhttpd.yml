name: Build uhttpd with trusted X-Real-IP

on:
  workflow_dispatch:
  push:
    branches: [main, realip-dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenWrt build system
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: openwrt-25.12
          path: openwrt

      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: realip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Pin uhttpd source revision
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('package/network/services/uhttpd/Makefile')
          s = '\n'.join(line for line in s.splitlines() if not line.startswith('PKG_MIRROR_HASH:=')) + '\n'
          s = s.replace('PKG_SOURCE_DATE:=2026-08-24', 'PKG_SOURCE_DATE:=2026-08-03')
          s = s.replace('PKG_SOURCE_VERSION:=373145f72c884c36a2b16f7f47e74ffae06bd754', 'PKG_SOURCE_VERSION:=60f64bec40c8113cf09815ec377761b1f4f95f22')
          s = '\\n'.join(line for line in s.splitlines() if not line.startswith('PKG_MIRROR_HASH:=')) + '\\n'
          if 'PKG_SOURCE_VERSION:=60f64bec40c8113cf09815ec377761b1f4f95f22' not in s:
              raise SystemExit('Could not pin expected uhttpd source revision')
          p.write_text(s)
          PY

      - name: Configure target and select uhttpd packages
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          EOF
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-lua=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_uhttpd-mod-ucode=y
          EOF
          echo '===== package selections ====='
          grep -E '^CONFIG_PACKAGE_uhttpd(=|[-_])' .config
          grep -q '^CONFIG_PACKAGE_uhttpd=y' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j4

      - name: Build host tools
        working-directory: openwrt
        run: |
          set -o pipefail
          mkdir -p ../realip
          make tools/install -j2 V=s 2>&1 | tee ../realip/artifacts-host-tools.log

      - name: Build target toolchain
        working-directory: openwrt
        run: |
          set -o pipefail
          make toolchain/install -j2 V=s 2>&1 | tee ../realip/artifacts-toolchain.log

      - name: Patch and build uhttpd
        working-directory: openwrt
        run: |
          set -o pipefail
          mkdir -p ../realip/artifacts
          make package/network/services/uhttpd/compile V=s -j2 2>&1 | tee ../realip/artifacts/prepare-build.log
          SOURCE_DIR="$(find build_dir -maxdepth 3 -type d -name 'uhttpd-*' -print -quit)"
          test -n "$SOURCE_DIR"
          python3 ../realip/scripts/apply_patch.py "$SOURCE_DIR" "$PWD/package/network/services/uhttpd"
          rm -f "$SOURCE_DIR/.built"
          make package/network/services/uhttpd/compile V=s -j2 2>&1 | tee ../realip/artifacts/build.log

      - name: Verify packages
        working-directory: openwrt
        run: |
          set -eu
          find bin/packages -type f -name 'uhttpd*.ipk' -print
          test -n "$(find bin/packages -type f -name 'uhttpd_*.ipk' -print -quit)"
          mkdir -p ../realip/artifacts
          cp bin/packages/*/base/uhttpd*.ipk ../realip/artifacts/
          for f in ../realip/artifacts/*.ipk; do
            echo "===== $f ====="
            ar t "$f"
            ar p "$f" control.tar.gz | tar -xzO ./control || true
          done
          find build_dir -type f -path '*/uhttpd-*/*' -name uhttpd -exec sh -c 'file "$1"; readelf -d "$1" | grep NEEDED || true' sh {} \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uhttpd-realip-ipk
          path: |
            realip/artifacts/*.ipk
            realip/artifacts/build.log
            realip/artifacts/prepare-build.log
            realip/artifacts-host-tools.log
            realip/artifacts-toolchain.log
          if-no-files-found: warn
          retention-days: 30
