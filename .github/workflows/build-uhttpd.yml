name: Build uhttpd with trusted real-IP headers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ImmortalWrt 24.10.6 build system
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v24.10.6
          path: openwrt

      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: realip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Pin uhttpd source revision
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('package/network/services/uhttpd/Makefile')
          s = p.read_text()
          s = re.sub(r'^PKG_SOURCE_DATE:=.*$', 'PKG_SOURCE_DATE:=2026-08-03', s, flags=re.M)
          s = re.sub(r'^PKG_SOURCE_VERSION:=.*$', 'PKG_SOURCE_VERSION:=60f64bec40c8113cf09815ec377761b1f4f95f22', s, flags=re.M)
          s = '\n'.join(line for line in s.splitlines() if not line.startswith('PKG_MIRROR_HASH:=')) + '\n'
          if 'PKG_SOURCE_VERSION:=60f64bec40c8113cf09815ec377761b1f4f95f22' not in s:
              raise SystemExit('Could not pin expected uhttpd source revision')
          p.write_text(s)
          print('Pinned uhttpd source to 60f64bec40c8113cf09815ec377761b1f4f95f22')
          PY

      - name: Configure aarch64_cortex-a53 package architecture
        working-directory: openwrt
        run: |
          # ImmortalWrt qualcommax/ipq807x supplies the Cortex-A53 target
          # toolchain mapping; it is an architecture reference, not the QWRT board target.
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          EOF
          make defconfig
          echo '===== resolved package architecture ====='
          grep -E '^CONFIG_TARGET_ARCH_PACKAGES=' .config
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"$' .config
          echo 'Architecture verified from .config; skipping make info (not required for package build).'
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_uhttpd=y
          EOF
          make defconfig

          echo '===== final package architecture ====='
          grep -E '^CONFIG_TARGET_ARCH_PACKAGES=' .config
          grep -qx 'CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config || {
            echo 'ERROR: package architecture mismatch'
            exit 1
          }

          echo '===== uhttpd core package configuration ====='
          if grep -qx 'CONFIG_PACKAGE_uhttpd=y' .config; then
            echo 'OK: CONFIG_PACKAGE_uhttpd=y'
          else
            echo 'ERROR: uhttpd core package is not enabled'
            grep -E '^CONFIG_PACKAGE_uhttpd=' .config || echo 'CONFIG_PACKAGE_uhttpd is unset'
            exit 1
          fi

          echo '===== optional uhttpd plugin configuration (diagnostic only) ====='
          for sym in \
            CONFIG_PACKAGE_uhttpd-mod-lua \
            CONFIG_PACKAGE_liblua \
            CONFIG_PACKAGE_uhttpd-mod-ubus \
            CONFIG_PACKAGE_uhttpd-mod-ucode; do
            if grep -qx "${sym}=y" .config; then
              echo "INFO: ${sym}=y"
            else
              echo "INFO: ${sym} is not enabled; this does not block the core uhttpd build"
            fi
          done

      - name: Download sources
        working-directory: openwrt
        run: make download -j4

      - name: Build host tools
        working-directory: openwrt
        run: |
          set -o pipefail
          make tools/install -j2 V=s 2>&1 | tee ../realip/artifacts-host-tools.log

      - name: Build target toolchain
        working-directory: openwrt
        run: |
          set -o pipefail
          make toolchain/install -j1 V=s 2>&1 | tee ../realip/artifacts-toolchain.log
          if ! find staging_dir -path '*/libgcc_s.so*' -print -quit | grep -q .; then
            echo 'ERROR: toolchain/install did not produce libgcc_s.so*'
            find staging_dir -maxdepth 3 -type d -name lib -print
            exit 1
          fi

      - name: Prepare, patch, and build uhttpd once
        working-directory: openwrt
        run: |
          set -o pipefail
          mkdir -p ../realip/artifacts
          make package/network/services/uhttpd/prepare V=s -j1 2>&1 | tee ../realip/artifacts/prepare.log
          SOURCE_DIR="$(find build_dir -maxdepth 3 -type d -name 'uhttpd-*' -print -quit)"
          test -n "$SOURCE_DIR"

          # Patch the prepared source, then persist the three modified source files
          # under package/.../src. The OpenWrt compile target may re-run Prepare,
          # which would otherwise overwrite a direct build_dir patch.
          python3 ../realip/scripts/apply_patch.py "$SOURCE_DIR" "$PWD/package/network/services/uhttpd"
          mkdir -p package/network/services/uhttpd/src
          cp -f "$SOURCE_DIR/uhttpd.h" package/network/services/uhttpd/src/uhttpd.h
          cp -f "$SOURCE_DIR/main.c" package/network/services/uhttpd/src/main.c
          cp -f "$SOURCE_DIR/client.c" package/network/services/uhttpd/src/client.c

          echo '===== verify patched source before compile ====='
          grep -q -- '-z address' "$SOURCE_DIR/main.c"
          grep -q 'client_update_real_ip' "$SOURCE_DIR/client.c"
          grep -q 'real_ip_trusted' "$SOURCE_DIR/uhttpd.h"

          make package/network/services/uhttpd/compile V=s -j1 2>&1 | tee ../realip/artifacts/build.log

      - name: Verify package architecture and ABI dependencies
        working-directory: openwrt
        run: |
          set -eu
          find bin/packages -type f -name 'uhttpd*.ipk' -print
          mkdir -p ../realip/artifacts
          find bin/packages -type f -name 'uhttpd*.ipk' -exec cp -t ../realip/artifacts/ {} +
          test -n "$(find ../realip/artifacts -type f -name 'uhttpd_*.ipk' -print -quit)"
          IPK="$(find ../realip/artifacts -maxdepth 1 -type f -name 'uhttpd_*.ipk' -print -quit)"
          test -n "$IPK"
          echo "===== inspect IPK archive: $IPK ====="
          tar -tzf "$IPK"

          # OpenWrt 24.10 uses a gzip-compressed tar container for .ipk.
          # Do not use "ar" here.
          CONTROL="$(tar -xzOf "$IPK" ./control.tar.gz | tar -xzOf - ./control)"
          printf '%s\n' "$CONTROL" | grep -E '^(Package|Architecture|Depends):'
          printf '%s\n' "$CONTROL" | grep -q '^Architecture: aarch64_cortex-a53

      - name: Upload packages and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uhttpd-realip-immortalwrt-24.10.6-aarch64-cortex-a53
          path: |
            realip/artifacts/*.ipk
            realip/artifacts/*.log
            realip/artifacts-host-tools.log
            realip/artifacts-toolchain.log
            realip/artifacts-lua.log
          if-no-files-found: warn
          retention-days: 30

          printf '%s\n' "$CONTROL" | grep -q 'libubox20240329'
          printf '%s\n' "$CONTROL" | grep -q 'libblobmsg-json20240329'
          printf '%s\n' "$CONTROL" | grep -q 'libjson-script20240329'
          printf '%s\n' "$CONTROL" | grep -q 'libjson-c5'

          echo '===== verify patched uhttpd binary ====='
          tar -xzOf "$IPK" ./data.tar.gz | tar -xzOf - ./usr/sbin/uhttpd > ../realip/artifacts/uhttpd
          file ../realip/artifacts/uhttpd
          strings -a ../realip/artifacts/uhttpd | grep -F -- '-z address'
          strings -a ../realip/artifacts/uhttpd | grep -F 'invalid trusted proxy address'
          strings -a ../realip/artifacts/uhttpd | grep -F 'x-forwarded-for'
          strings -a ../realip/artifacts/uhttpd | grep -F 'x-real-ip'
          tar -xzOf "$IPK" ./data.tar.gz | tar -xzOf - ./etc/init.d/uhttpd | grep -F -- 'command -z "$addr"'

          find build_dir -type f -path '*/uhttpd-*/*' -name uhttpd -exec sh -c 'file "$1"; readelf -d "$1" | grep NEEDED || true' sh {} ;

      - name: Upload packages and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uhttpd-realip-immortalwrt-24.10.6-aarch64-cortex-a53
          path: |
            realip/artifacts/*.ipk
            realip/artifacts/*.log
            realip/artifacts-host-tools.log
            realip/artifacts-toolchain.log
            realip/artifacts-lua.log
          if-no-files-found: warn
          retention-days: 30
