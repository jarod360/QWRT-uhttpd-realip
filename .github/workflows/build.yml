name: Build uhttpd with trusted X-Real-IP

on:
  push:
    branches: [main, 'feat/realip-disabled-by-default']
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenWrt build system
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: openwrt-25.12
          path: openwrt

      - name: Checkout this project
        uses: actions/checkout@v4
        with:
          path: realip

      - name: Validate RealIP source patcher
        run: python3 -m py_compile realip/scripts/apply_patch.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget

      - name: Pin uhttpd to the firmware source revision
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("package/network/services/uhttpd/Makefile")
          s = p.read_text()
          s, nd = re.subn(r"^PKG_SOURCE_DATE:=.*$", "PKG_SOURCE_DATE:=2026-08-03", s, count=1, flags=re.M)
          s, nv = re.subn(r"^PKG_SOURCE_VERSION:=.*$", "PKG_SOURCE_VERSION:=60f64bec40c8113cf09815ec377761b1f4f95f22", s, count=1, flags=re.M)
          if nd != 1 or nv != 1:
              raise SystemExit("Could not pin uhttpd source revision")
          s = "\n".join(line for line in s.splitlines()
                        if not line.startswith("PKG_MIRROR_HASH:=")) + "\n"
          if "PKG_SOURCE_VERSION:=60f64bec40c8113cf09815ec377761b1f4f95f22" not in s:
              raise SystemExit("Could not pin the expected uhttpd source revision")
          p.write_text(s)
          PY

      - name: Configure ARM64 Cortex-A53 target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          # OpenWrt 25.12 normally produces APK packages. Force legacy IPK for
          # this project only; such an IPK is not suitable for APK-only devices.
          # CONFIG_USE_APK is not set
          CONFIG_PACKAGE_uhttpd=m
          CONFIG_PACKAGE_uhttpd-mod-lua=m
          CONFIG_PACKAGE_uhttpd-mod-ubus=m
          CONFIG_PACKAGE_uhttpd-mod-ucode=m
          EOF
          make defconfig
          grep -qx '# CONFIG_USE_APK is not set' .config
          grep -qx 'CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j4

      - name: Apply real-IP changes and build packages
        working-directory: openwrt
        run: |
          mkdir -p ../realip/artifacts
          make package/network/services/uhttpd/prepare V=s
          SOURCE_DIR="$(find build_dir -maxdepth 3 -type d -name 'uhttpd-*' -print -quit)"
          test -n "$SOURCE_DIR"
          python3 ../realip/scripts/apply_patch.py "$SOURCE_DIR" "$PWD/package/network/services/uhttpd"
          set -o pipefail
          make package/network/services/uhttpd/compile V=s -j2 2>&1 | tee ../realip/artifacts/build.log

      - name: Verify package architecture and ELF dependencies
        working-directory: openwrt
        run: |
          set -eu
          find bin -type f -name 'uhttpd*.ipk' -print
          test -n "$(find bin -type f -name 'uhttpd_*.ipk' -print -quit)"
          mkdir -p ../realip/artifacts
          find bin -type f -name 'uhttpd*.ipk' -exec cp -t ../realip/artifacts/ {} +
          for f in ../realip/artifacts/*.ipk; do
            echo "===== $f ====="
            tar -tzf "$f"
            tar -xzOf "$f" ./control.tar.gz | tar -xzOf - ./control
          done
          IPK="$(find ../realip/artifacts -maxdepth 1 -name 'uhttpd_*.ipk' -print -quit)"
          CHECK_DIR=../realip/artifacts/package-check
          mkdir -p "$CHECK_DIR"
          tar -xzOf "$IPK" ./data.tar.gz | tar -xz -C "$CHECK_DIR" -f -
          grep -Fq "option realip_enabled '0'" "$CHECK_DIR/etc/config/uhttpd"
          grep -Fq 'config_get_bool realip_enabled "$cfg" realip_enabled 0' "$CHECK_DIR/etc/init.d/uhttpd"
          strings "$CHECK_DIR/usr/sbin/uhttpd" | grep -F 'ignoring invalid trusted proxy IP'
          echo 'OK: packaged uhttpd, init and default config verified'
          find build_dir -type f -path '*/uhttpd-*/*' -name uhttpd -exec sh -c '
            file "$1"
            readelf -d "$1" | grep NEEDED || true
          ' sh {} \;

      - name: Upload IPK packages and build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uhttpd-realip-ipk
          path: |
            realip/artifacts/*.ipk
            realip/artifacts/build.log
          if-no-files-found: warn
          retention-days: 30
